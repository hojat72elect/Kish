name: CI

on:
  push:
    branches: [main]
  pull_request:

# The pipeline only reads the repository, so keep the token read-only.
permissions:
  contents: read

# A new push to the same branch or PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      # The tests exercise the lexer and the parser in isolation, so also make sure
      # the end-to-end sample in index.ts still runs.
      - name: Run the sample program
        run: bun run dev
